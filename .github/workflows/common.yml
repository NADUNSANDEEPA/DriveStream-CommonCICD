name: 🚀 Shared DriveStream CI Pipeline

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string

      image_name:
        required: true
        type: string

      test_command:
        required: true
        type: string

      build_command:
        required: true
        type: string

    secrets:
      DOCKER_USERNAME:
        required: true

      DOCKER_PASSWORD:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────
  # INSTALL
  # ─────────────────────────────
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  # ─────────────────────────────
  # LINT
  # ─────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  # ─────────────────────────────
  # TEST
  # ─────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run Tests
        run: ${{ inputs.test_command }}

  # ─────────────────────────────
  # BUILD
  # ─────────────────────────────
  build:
    name: 🏗️ Build App
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build Project
        run: ${{ inputs.build_command }}

  # ─────────────────────────────
  # DOCKER BUILD & PUSH
  # ─────────────────────────────
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ─────────────────────────────
      # Set image tag (IMPORTANT FOR CI/CD + Argo CD)
      # ─────────────────────────────
      - name: Set Image Tag
        id: vars
        run: echo "TAG=${{ github.sha }}" >> $GITHUB_ENV

      # ─────────────────────────────
      # Build Docker Image (BuildKit controlled)
      # ─────────────────────────────
      - name: Build Docker Image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --progress=plain \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ env.TAG }} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:latest \
            .

      # ─────────────────────────────
      # Push Docker Image
      # ─────────────────────────────
      - name: Push Docker Image (latest + versioned)
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ env.TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:latest

  # ─────────────────────────────
  # APPROVAL
  # ─────────────────────────────
  approval:
    name: 🔐 Approval Gate
    runs-on: ubuntu-latest
    needs: docker

    environment:
      name: production

    steps:
      - name: Approval Granted
        run: echo "Approved for production deployment."

      - name: Post Approval Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "✅ Approval granted. Ready for production deployment."
            })